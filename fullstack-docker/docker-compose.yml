services:
  # -------------------- MongoDB --------------------
  mongo:
    image: mongo
    container_name: mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: messagesdb
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net

  # -------------------- Mongo Express --------------------
  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_SERVER: mongo
    ports:
      - "8081:8081"
    networks:
      - app_net

  # -------------------- Backend --------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    working_dir: /app
    volumes:
      - ./backend:/app
    command: bash -c "npm install && node server.js"
    environment:
      MONGO_USER: root
      MONGO_PASS: example
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: messagesdb
    depends_on:
      - mongo
    expose:
      - "5000"
    networks:
      - app_net

  # -------------------- Frontend --------------------
  frontend:
    build:
      context: ./frontend/frontend   # React app location
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "/api"
    container_name: frontend_app
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app_net

  # -------------------- Nginx Reverse Proxy --------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  mongo_data:

