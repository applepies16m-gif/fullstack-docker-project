version: "3.9"

services:
  # Backend API
  mern-api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: mern-api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=YOUR_secret_key
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
    depends_on:
      - mongo
    networks:
      - mern-network

  # Frontend React app
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    container_name: client
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3000"   # optional, only if wanting direct access
    networks:
      - mern-network

  # MongoDB database
  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  # Nginx reverse proxy
  mern-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mern-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - client
      - mern-api
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
