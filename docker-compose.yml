version: '3.8'
services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-net

  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/mern-social
      - NODE_ENV=development
      - PORT=5000
    depends_on:
      - mongo
    networks:
      - mern-net

  frontend:
    image: node:18
    working_dir: /usr/src/app/frontend
    command: bash -c "npm install && npm start"
    volumes:
      - ./frontend:/usr/src/app/frontend
    ports:
      - "3000:3000"
    networks:
      - mern-net

volumes:
  mongo-data:

networks:
  mern-net:
