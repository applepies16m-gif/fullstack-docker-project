events { }

http {
    server {
        listen 80;
        server_name _;
	# Proxy to frontend (React)
        location / {
            proxy_pass http://frontend_app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy to backend API
        location /api/ {
            proxy_pass http://backend_app:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
